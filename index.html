size: 0.8rem; color: var(--sheet-muted); }\n.toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 20px); transform: translateX(-50%); background: var(--ink); color: var(--panel); padding: 10px 18px; border-radius: 10px; font-size: 0.9rem; z-index: 20; max-width: calc(100% - 32px); }\n\n/* improve panel */\n.improve h2 small { display: block; font-weight: 500; font-size: 0.84rem; color: var(--muted); margin-top: 4px; line-height: 1.45; }\n.parts { display: flex; flex-direction: column; gap: 6px; }\n.part { display: flex; align-items: center; gap: 10px; border: 1px solid var(--line); padding: 8px 10px; cursor: pointer; font-size: 0.9rem; line-height: 1.35; }\n.part input { accent-color: var(--accent); width: 17px; height: 17px; flex: none; }\n.part span { flex: 1; min-width: 0; }\n.part:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }\n.badge { flex: none; font-size: 0.74rem; font-weight: 700; padding: 1px 7px; border-radius: 3px; }\n.badge.bad { background: var(--badbg); color: var(--bad); } .badge.ok { background: var(--okbg); color: var(--ok); }\n.field label.auto, .auto { display: flex; gap: 8px; align-items: center; font-size: 0.86rem; color: var(--ink); text-transform: none; letter-spacing: 0; font-weight: 500; margin-top: 4px; }\n.auto input { accent-color: var(--accent); }\n.focus-flag { font-size: 0.82rem; color: var(--accent); font-weight: 700; }\n/* squarer outer UI */\n.maker, .tabs, .tabs button, .maker input[type=\"text\"], .maker select, .maker textarea, .drop, .chip, .chip button, .seg,\n.go, .status .stop, .status .bar, .recent button, .toolbar button, .score, .example-flag, .lessons, .lessons .ls, .lessons .foot button, .toast, .part { border-radius: 3px; }\n.tabs { padding: 3px; gap: 3px; }\n.tabs button[aria-selected=\"true\"] { box-shadow: 0 0 0 1px var(--line); }\n.maker { box-shadow: 0 1px 0 var(--line); }\n.score.has { border-color: var(--ok); }\n.sheet { border-radius: 0; }\n@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }\n<\/style>\n\n<header class=\"top\">\n  <div class=\"brand\">Bảng Đen <span>Số<\/span><\/div>\n  <div class=\"tagline\">Biến một bài học trong SGK thành tài liệu rời: lý thuyết có chỗ trống để điền, kèm câu hỏi sau mỗi phần.<\/div>\n<\/header>\n\n<div class=\"layout\">\n  <div class=\"side\">\n  <aside class=\"maker\" aria-label=\"Tạo tài liệu rời\">\n    <h2>Tạo tài liệu rời<\/h2>\n    <div class=\"tabs\" role=\"tablist\">\n      <button type=\"button\" role=\"tab\" id=\"tabName\" aria-selected=\"true\">Gõ tên bài<\/button>\n      <button type=\"button\" role=\"tab\" id=\"tabFile\" aria-selected=\"false\">Tải tài liệu lên<\/button>\n    <\/div>\n    <div class=\"row2\">\n      <div class=\"field\"><label for=\"grade\">Lớp<\/label><select id=\"grade\"><\/select><\/div>\n      <div class=\"field\"><label for=\"subject\">Môn học<\/label><select id=\"subject\"><\/select><\/div>\n    <\/div>\n    <div class=\"field\"><label for=\"book\">Bộ sách<\/label>\n      <select id=\"book\">\n        <option value=\"Kết nối tri thức với cuộc sống\">Kết nối tri thức (SGK thống nhất)<\/option>\n        <option value=\"Chân trời sáng tạo\">Chân trời sáng tạo (trước 2026)<\/option>\n        <option value=\"Cánh Diều\">Cánh Diều (trước 2026)<\/option>\n        <option value=\"Khác / không rõ\">Khác / không rõ<\/option>\n      <\/select>\n    <\/div>\n    <div id=\"paneName\" class=\"field\">\n      <label for=\"lesson\">Tên bài<\/label>\n      <div class=\"combo\">\n        <input type=\"text\" id=\"lesson\" placeholder=\"Bấm để chọn bài, hoặc gõ tên bài\" autocomplete=\"off\" role=\"combobox\" aria-expanded=\"false\" aria-controls=\"lessonList\">\n        <div class=\"lessons\" id=\"lessonList\" role=\"listbox\" hidden><\/div>\n      <\/div>\n    <\/div>\n    <div id=\"paneFile\" class=\"field\" hidden>\n      <span class=\"lbl\">Tài liệu bài học<\/span>\n      <div class=\"drop\" id=\"drop\" tabindex=\"0\" role=\"button\" aria-label=\"Chọn tệp\">Kéo thả tệp vào đây hoặc <b>chọn tệp<\/b><br><small>PDF, Word (.docx), ảnh chụp trang SGK, .txt<\/small><\/div>\n      <input type=\"file\" id=\"fileInput\" multiple accept=\".pdf,.docx,.txt,.md,image/*\" hidden>\n      <div class=\"chips\" id=\"fileChips\"><\/div>\n      <label for=\"pasted\" style=\"margin-top:6px\">Hoặc dán nội dung bài<\/label>\n      <textarea id=\"pasted\" placeholder=\"Dán phần lý thuyết của bài học vào đây...\"><\/textarea>\n      <input type=\"text\" id=\"lesson2\" placeholder=\"Tên bài (không bắt buộc)\">\n      <label class=\"auto\"><input type=\"checkbox\" id=\"autoGen\" checked> Tự tạo phiếu ngay khi tải tệp lên<\/label>\n    <\/div>\n    <div class=\"field\"><span class=\"lbl\">Mức độ câu hỏi<\/span>\n      <div class=\"seg\">\n        <input type=\"radio\" name=\"lvl\" id=\"lvAuto\" value=\"auto\" checked><label for=\"lvAuto\">Theo lớp<\/label>\n        <input type=\"radio\" name=\"lvl\" id=\"lvEasy\" value=\"easy\"><label for=\"lvEasy\">Dễ hơn<\/label>\n        <input type=\"radio\" name=\"lvl\" id=\"lvHard\" value=\"hard\"><label for=\"lvHard\">Khó hơn<\/label>\n      <\/div>\n    <\/div>\n    <div class=\"field\"><span class=\"lbl\">Độ dài phiếu<\/span>\n      <div class=\"seg\">\n        <input type=\"radio\" name=\"len\" id=\"lnS\" value=\"short\"><label for=\"lnS\">Ngắn<\/label>\n        <input type=\"radio\" name=\"len\" id=\"lnM\" value=\"medium\" checked><label for=\"lnM\">Vừa<\/label>\n        <input type=\"radio\" name=\"len\" id=\"lnL\" value=\"long\"><label for=\"lnL\">Đầy đủ<\/label>\n      <\/div>\n    <\/div>\n    <button class=\"go\" id=\"goBtn\" type=\"button\">Tạo tài liệu rời<\/button>\n    <div class=\"status\" id=\"status\" aria-live=\"polite\"><\/div>\n    <p class=\"hintnote\">Khi chỉ gõ tên bài, nội dung được soạn theo kiến thức chung của bài nên có thể khác SGK một chút. Tải tài liệu lên để phiếu bám sát sách nhất.<\/p>\n  <\/aside>\n\n  <section class=\"maker improve\" aria-label=\"Cải thiện một phần\">\n    <h2>Cải thiện một phần<small>Chọn phần bạn muốn học kỹ hơn. AI soạn phiếu ôn riêng cho phần đó: giải thích sâu hơn và nhiều bài luyện từ dễ đến khó. Sau khi “Kiểm tra bài”, các phần còn sai được chọn sẵn.<\/small><\/h2>\n    <div class=\"parts\" id=\"parts\"><\/div>\n    <div class=\"field\"><span class=\"lbl\">Mục tiêu<\/span>\n      <div class=\"seg\">\n        <input type=\"radio\" name=\"goal\" id=\"gTheory\" value=\"theory\"><label for=\"gTheory\">Nắm lý thuyết<\/label>\n        <input type=\"radio\" name=\"goal\" id=\"gPractice\" value=\"practice\" checked><label for=\"gPractice\">Luyện bài tập<\/label>\n        <input type=\"radio\" name=\"goal\" id=\"gAdv\" value=\"advanced\"><label for=\"gAdv\">Nâng cao<\/label>\n      <\/div>\n    <\/div>\n    <div class=\"field\"><label for=\"focusNote\">Chỗ bạn chưa hiểu (không bắt buộc)<\/label>\n      <textarea id=\"focusNote\" placeholder=\"VD: Em hay nhầm tế bào nhân sơ với nhân thực\" style=\"min-height:64px\"><\/textarea><\/div>\n    <button class=\"go\" id=\"improveBtn\" type=\"button\">Tạo phiếu ôn phần đã chọn<\/button>\n    <div class=\"status\" id=\"status2\" aria-live=\"polite\"><\/div>\n  <\/section>\n  <section class=\"maker\" id=\"recentWrap\" hidden aria-label=\"Phiếu gần đây\"><span class=\"lbl\">Phiếu gần đây<\/span><div class=\"recent\" id=\"recent\"><\/div><\/section>\n  <\/div>\n\n  <section class=\"sheet-col\">\n    <div class=\"toolbar\">\n      <button type=\"button\" class=\"primary\" id=\"checkBtn\">Kiểm tra bài<\/button>\n      <button type=\"button\" id=\"ansBtn\">Hiện đáp án<\/button>\n      <button type=\"button\" id=\"resetBtn\">Làm lại<\/button>\n      <button type=\"button\" id=\"aiGradeBtn\" hidden>Nhờ AI chấm tự luận<\/button>\n      <button type=\"button\" id=\"dlBtn\" hidden>Tải file Word<\/button>\n      <span class=\"score\" id=\"score\">Chưa chấm<\/span>\n    <\/div>\n    <div class=\"example-flag\" id=\"exFlag\">Đây là phiếu mẫu. Chọn lớp, môn, gõ tên bài hoặc tải tài liệu lên rồi bấm “Tạo tài liệu rời” để có phiếu của bạn.<\/div>\n    <article class=\"sheet\" id=\"sheet\" aria-live=\"polite\"><\/article>\n  <\/section>\n<\/div>\n\n<script>\n(() => {\n'use strict';\nconst $ = s => document.querySelector(s);\nconst esc = s => String(s ?? '').replace(/[&<>\"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '\"': '&quot;', \"'\": '&#39;' }[c]));\nconst norm = s => String(s ?? '').normalize('NFC').toLowerCase().replace(/[.,;:!?\"'“”()\\[\\]]/g, '').replace(/\\s+/g, ' ').trim();\nconst shuffle = a => { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };\nconst LETTERS = 'ABCDEFGHIJ';\nfunction toast(msg) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 3200); }\nconst store = { get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };\n\n/* ---------- form setup ---------- */\n// subjects that have a textbook in each grade (GDPT 2018)\nconst SUBJECTS = [\n  ['Toán', 1, 12], ['Tiếng Việt', 1, 5], ['Ngữ văn', 6, 12], ['Tiếng Anh', 1, 12], ['Tự nhiên và Xã hội', 1, 3], ['Khoa học', 4, 5],\n  ['Khoa học tự nhiên', 6, 9], ['Lịch sử và Địa lí', 4, 9], ['Vật lí', 10, 12], ['Hoá học', 10, 12], ['Sinh học', 10, 12], ['Lịch sử', 10, 12], ['Địa lí', 10, 12],\n  ['Đạo đức', 1, 5], ['Giáo dục công dân', 6, 9], ['Giáo dục kinh tế và pháp luật', 10, 12], ['Tin học', 3, 12], ['Công nghệ', 3, 12],\n  ['Hoạt động trải nghiệm', 1, 12], ['Giáo dục thể chất', 1, 12], ['Âm nhạc', 1, 12], ['Mĩ thuật', 1, 12], ['Giáo dục quốc phòng và an ninh', 10, 12], ['Khác', 1, 12]\n];\nconst gradeSel = $('#grade'), subjSel = $('#subject');\nfor (let g = 1; g <= 12; g++) gradeSel.add(new Option('Lớp ' + g, g));\nfunction fillSubjects() {\n  const g = +gradeSel.value, keep = subjSel.value; subjSel.innerHTML = '';\n  SUBJECTS.filter(([, a, b]) => g >= a && g <= b).forEach(([n]) => subjSel.add(new Option(n, n)));\n  if ([...subjSel.options].some(o => o.value === keep)) subjSel.value = keep;\n}\ngradeSel.value = '6'; fillSubjects(); subjSel.value = 'Khoa học tự nhiên';\ngradeSel.addEventListener('change', fillSubjects);\nlet mode = 'name';\nfunction setTab(m) {\n  mode = m;\n  $('#tabName').setAttribute('aria-selected', m === 'name'); $('#tabFile').setAttribute('aria-selected', m === 'file');\n  $('#paneName').hidden = m !== 'name'; $('#paneFile').hidden = m !== 'file';\n}\n$('#tabName').onclick = () => setTab('name'); $('#tabFile').onclick = () => setTab('file');\n\n/* ---------- files ---------- */\nlet files = [];\nconst fileInput = $('#fileInput'), drop = $('#drop');\nfunction renderChips() {\n  $('#fileChips').innerHTML = files.map((f, i) => `<span class=\"chip\"><span>${esc(f.name)}<\/span><button type=\"button\" data-i=\"${i}\" aria-label=\"Bỏ tệp\">✕<\/button><\/span>`).join('');\n}\n$('#fileChips').onclick = e => { const b = e.target.closest('button[data-i]'); if (b) { files.splice(+b.dataset.i, 1); renderChips(); } };\nfunction addFiles(list) { for (const f of list) files.push(f); files = files.slice(0, 8); renderChips(); maybeAutoGenerate(); }\ndrop.onclick = () => fileInput.click();\ndrop.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fileInput.click(); } };\nfileInput.onchange = () => { addFiles(fileInput.files); fileInput.value = ''; };\n['dragenter', 'dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));\n['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));\ndrop.addEventListener('drop', e => { if (e.dataTransfer?.files?.length) addFiles(e.dataTransfer.files); });\n\nconst scriptCache = {};\nfunction loadScript(src) {\n  return scriptCache[src] ||= new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('load ' + src)); document.head.appendChild(s); });\n}\nconst LIB = {\n  pdf: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js',\n  pdfWorker: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js',\n  mammoth: 'https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js',\n  docx: 'https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js'\n};\nasync function pdfToContent(file, maxImages) {\n  await loadScript(LIB.pdf); await loadScript(LIB.pdfWorker);\n  const lib = window.pdfjsLib; lib.GlobalWorkerOptions.workerSrc = LIB.pdfWorker;\n  const pdf = await lib.getDocument({ data: new Uint8Array(await file.arrayBuffer()), isEvalSupported: false }).promise;\n  let text = '';\n  for (let p = 1; p <= Math.min(pdf.numPages, 40); p++) {\n    const page = await pdf.getPage(p); const tc = await page.getTextContent();\n    text += tc.items.map(it => it.str + (it.hasEOL ? '\\n' : ' ')).join('') + '\\n\\n';\n  }\n  const images = [];\n  if (text.replace(/\\s/g, '').length < 200 && maxImages > 0) {      // scanned PDF: send page pictures instead\n    for (let p = 1; p <= Math.min(pdf.numPages, maxImages); p++) {\n      const page = await pdf.getPage(p); const vp = page.getViewport({ scale: 1.6 });\n      const c = document.createElement('canvas'); c.width = vp.width; c.height = vp.height;\n      await page.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;\n      images.push(await new Promise(r => c.toBlob(r, 'image/jpeg', 0.85)));\n    }\n  }\n  return { text, images };\n}\nasync function collectSource(limits) {\n  let text = $('#pasted').value.trim() ? $('#pasted').value.trim() + '\\n\\n' : '';\n  const images = []; const maxImg = limits?.images?.maxCount || 0; const notes = [];\n  for (const f of files) {\n    const name = f.name.toLowerCase();\n    if (f.type.startsWith('image/')) {\n      if (maxImg && images.length < maxImg) images.push(f); else notes.push(f.name);\n    } else if (name.endsWith('.pdf')) {\n      const r = await pdfToContent(f, maxImg - images.length); text += r.text; images.push(...r.images);\n    } else if (name.endsWith('.docx')) {\n      await loadScript(LIB.mammoth);\n      const r = await window.mammoth.extractRawText({ arrayBuffer: await f.arrayBuffer() }); text += r.value + '\\n\\n';\n    } else { text += (await f.text()) + '\\n\\n'; }\n  }\n  return { text: text.slice(0, 60000), images, skipped: notes };\n}\n\n/* ---------- prompt ---------- */\nfunction levelGuide(g, lvl) {\n  let band = g <= 3 ? 0 : g <= 5 ? 1 : g <= 9 ? 2 : 3;\n  if (lvl === 'easy') band = Math.max(0, band - 1); if (lvl === 'hard') band = Math.min(3, band + 1);\n  return [\n    'Học sinh nhỏ (lớp 1–3): câu ngắn, từ ngữ đơn giản, gần gũi. Dùng chủ yếu: fill, mcq (3 lựa chọn), tf (2–3 ý), match (3–4 cặp). Đáp án chỗ trống 1–2 từ.',\n    'Tiểu học lớp 4–5: thêm order và short ngắn (1–2 câu). mcq 4 lựa chọn. Có 1–2 câu vận dụng vào đời sống.',\n    'THCS: đủ các loại. Có câu hiểu, vận dụng, tình huống thực tế, giải thích \"vì sao\". short yêu cầu trả lời 2–4 câu. Có thể có bài tập tính toán nếu môn học cần.',\n    'THPT: mức vận dụng và vận dụng cao. Theo cấu trúc đề mới: mcq 4 lựa chọn với phương án nhiễu hợp lí; tf dạng Đúng/Sai 4 ý a, b, c, d xoay quanh một tình huống/đoạn dữ liệu; short dạng \"trả lời ngắn\" (đáp án là một con số hoặc cụm từ ngắn) và câu tự luận phân tích, so sánh, đánh giá, giải thích hiện tượng, đọc bảng số liệu.'\n  ][band];\n}\nfunction buildPrompt(o) {\n  const counts = { short: '2–3 phần, mỗi phần 2 câu hỏi, luyện tập tổng hợp 2 câu', medium: '3–5 phần, mỗi phần 2–3 câu hỏi, luyện tập tổng hợp 3–4 câu', long: '4–6 phần, mỗi phần 3–4 câu hỏi, luyện tập tổng hợp 4–6 câu' }[o.len];\n  const src = o.text ? `NỘI DUNG BÀI HỌC (chỉ dùng kiến thức trong tài liệu này; giữ đúng thuật ngữ, số liệu, bố cục mục của tài liệu):\\n\"\"\"\\n${o.text}\\n\"\"\"` :\n    (o.images ? 'Nội dung bài học nằm trong các ảnh đính kèm (ảnh chụp trang SGK/tài liệu). Chỉ dùng kiến thức trong ảnh.' :\n      'Chưa có tài liệu: hãy soạn theo kiến thức chuẩn của bài này trong chương trình GDPT 2018, bám sát bố cục các mục của bài trong bộ sách đã nêu. Chỉ dùng kiến thức chắc chắn đúng.');\n  return `Bạn là giáo viên Việt Nam giỏi, đang soạn TÀI LIỆU RỜI (phiếu học tập \"đục lỗ\") để học sinh vừa học lý thuyết vừa luyện tập.\nThông tin: Lớp ${o.grade}; Môn ${o.subject}; Bộ sách: ${o.book}; Bài: ${o.lesson || '(xác định từ tài liệu)'}.\n${src}\n\nYÊU CẦU\n1. Chia lý thuyết theo bố cục các mục của bài (dùng số La Mã: I., II., ...): ${counts}.\n2. Mỗi phần có \"theory\": 3–7 ý tóm tắt lý thuyết, viết thành câu hoàn chỉnh. ĐỤC LỖ các từ khóa quan trọng nhất bằng {{đáp án}} (mỗi phần 3–8 chỗ trống, mỗi đáp án 1–4 từ, không đục từ vô nghĩa như \"là\", \"và\"). Nếu có nhiều đáp án chấp nhận được, viết {{đáp án 1|đáp án 2}}.\n3. Sau mỗi phần là \"questions\" gồm nhiều LOẠI câu khác nhau (không lặp một loại quá 2 lần trong một phần). Thêm \"practice\": luyện tập tổng hợp cuối phiếu.\n4. Mức độ: ${levelGuide(o.grade, o.level)}\n5. Toàn bộ bằng tiếng Việt chuẩn, có dấu. Không bịa số liệu. Công thức viết dạng văn bản thường (vd: v = s/t, H₂O).\n\nCÁC LOẠI CÂU HỎI (đúng định dạng JSON):\n- {\"type\":\"fill\",\"q\":\"Câu có {{chỗ trống}} cần điền.\"}\n- {\"type\":\"mcq\",\"q\":\"Câu hỏi?\",\"options\":[\"...\",\"...\",\"...\",\"...\"],\"answer\":0,\"explain\":\"giải thích ngắn\"}   (answer = chỉ số phương án đúng, bắt đầu từ 0)\n- {\"type\":\"tf\",\"q\":\"Dẫn đề hoặc tình huống\",\"items\":[{\"s\":\"Nhận định\",\"answer\":true}]}\n- {\"type\":\"match\",\"q\":\"Nối mỗi ý ở cột A với một ý phù hợp ở cột B.\",\"pairs\":[{\"a\":\"...\",\"b\":\"...\"}]}   (3–5 cặp, cột B không trùng nhau)\n- {\"type\":\"order\",\"q\":\"Sắp xếp ... theo đúng thứ tự.\",\"items\":[\"bước 1\",\"bước 2\",\"bước 3\",\"bước 4\"]}   (liệt kê theo thứ tự ĐÚNG)\n- {\"type\":\"short\",\"q\":\"Câu hỏi\",\"answer\":\"đáp án hoặc đáp án mẫu\"}   (đáp án ngắn ≤ 4 từ/con số thì học sinh tự điền và được chấm tự động; dài hơn là câu tự luận)\n\nTRẢ VỀ DUY NHẤT một JSON:\n{\"title\":\"tên bài\",\"subject\":\"${o.subject}\",\"grade\":${o.grade},\"objectives\":[\"mục tiêu 1\",\"mục tiêu 2\"],\"sections\":[{\"heading\":\"I. ...\",\"theory\":[\"... {{...}} ...\"],\"questions\":[...]}],\"practice\":[...]}`;\n}\n\n/* ---------- generation ---------- */\nlet sample = null, sampleLimits = null, downloads = null;\nfunction claudeHost() {\n  // inside the bookshelf page the tool runs in an iframe: use the page that owns the capabilities\n  try { if (window.parent !== window && window.parent.claude?.use) return window.parent.claude; } catch (e) {}\n  return window.claude?.use ? window.claude : null;\n}\nconst capReady = (async () => {\n  const CL = claudeHost(); if (!CL) return;\n  try { sample = await CL.use('sample'); } catch (e) { sample = null; }\n  if (sample) sampleLimits = await sample.limits().catch(() => null);\n  try { downloads = await CL.use('downloads'); } catch (e) { downloads = null; }\n  $('#dlBtn').hidden = !downloads;\n  $('#aiGradeBtn').hidden = !sample || !hasLongShort;\n})();\nconst status = $('#status'); let ctl = null;\nfunction setStatus(html) { status.innerHTML = html; }\nconst ERR = {\n  not_granted: 'Bạn chưa cho phép trang dùng Claude nên chưa tạo được phiếu.', sampling_disabled: 'Tài khoản này chưa dùng được tính năng hỏi Claude.',\n  rate_limited: 'Đã gửi quá nhiều yêu cầu. Chờ một lúc rồi thử lại.', session_expired: 'Phiên đăng nhập đã hết hạn. Hãy đăng nhập lại.',\n  prompt_too_large: 'Tài liệu quá dài. Hãy chỉ tải lên phần của một bài.', invalid_json: 'Kết quả bị lỗi định dạng. Bấm tạo lại một lần nữa.',\n  refused: 'Claude không xử lý được nội dung này. Hãy thử tài liệu khác.', image_rejected: 'Ảnh không đọc được. Hãy chọn ảnh JPG hoặc PNG rõ hơn.',\n  images_unavailable: 'Trang này chưa gửi được ảnh. Hãy dán chữ hoặc dùng PDF/Word có chữ.'\n};\nlet busy = false;\nasync function runSample(prompt, o, images, stEl) {\n  ctl = new AbortController(); busy = true;\n  $('#goBtn').disabled = true; $('#improveBtn').disabled = true;\n  stEl.innerHTML = '<div class=\"stTxt\">Đang suy nghĩ... (thường mất 30 giây – 2 phút)<\/div><div class=\"bar\"><i><\/i><\/div><button type=\"button\" class=\"stop\">Dừng<\/button>';\n  const txt = stEl.querySelector('.stTxt'), bar = stEl.querySelector('.bar i');\n  stEl.querySelector('.stop').onclick = () => ctl?.abort();\n  const expect = { short: 6000, medium: 10000, long: 15000 }[o.len] || 11000;\n  try {\n    const opts = { signal: ctl.signal, modelTier: o.grade >= 10 || o.level === 'hard' || o.goal === 'advanced' ? 'complex' : 'default',\n      onText: ({ text }) => {\n        const hs = [...text.matchAll(/\"heading\"\\s*:\\s*\"([^\"]*)\"/g)];\n        txt.textContent = hs.length ? 'Đang soạn: ' + hs[hs.length - 1][1] : (text.includes('\"practice\"') ? 'Đang soạn phần luyện tập...' : 'Đang soạn...');\n        bar.style.width = Math.min(96, text.length / expect * 100) + '%';\n      } };\n    if (images && images.length) opts.images = images;\n    const data = await sample.json(prompt, opts);\n    if (!data || !Array.isArray(data.sections) || !data.sections.length) throw { code: 'invalid_json' };\n    stEl.innerHTML = 'Xong! Phiếu đã hiện bên cạnh.';\n    return data;\n  } catch (e) {\n    if (e?.code === 'cancelled') stEl.innerHTML = 'Đã dừng.';\n    else stEl.innerHTML = '<span class=\"err\">' + esc(ERR[e?.code] || 'Có lỗi khi tạo phiếu. Hãy thử lại.') + '<\/span>';\n    return null;\n  } finally { $('#goBtn').disabled = false; $('#improveBtn').disabled = false; ctl = null; busy = false; }\n}\nfunction showNew(data, c) {\n  data._ctx = c; renderSheet(data, false); saveRecent(data);\n  if (window.matchMedia('(max-width: 960px)').matches) $('#sheet').scrollIntoView({ behavior: 'smooth' });\n}\n$('#goBtn').onclick = async () => {\n  if (busy) return;\n  if (!sample) { setStatus('<span class=\"err\">Cần mở trang trong Claude (đã đăng nhập) để tạo phiếu mới. Bạn vẫn có thể làm thử phiếu mẫu bên cạnh.<\/span>'); return; }\n  const o = { grade: +gradeSel.value, subject: subjSel.value, book: $('#book').value, level: document.querySelector('input[name=\"lvl\"]:checked').value, len: document.querySelector('input[name=\"len\"]:checked').value };\n  let images = [];\n  if (mode === 'name') {\n    o.lesson = $('#lesson').value.trim();\n    if (!o.lesson) { setStatus('<span class=\"err\">Hãy gõ tên bài trước.<\/span>'); $('#lesson').focus(); return; }\n  } else {\n    o.lesson = $('#lesson2').value.trim();\n    if (!files.length && !$('#pasted').value.trim()) { setStatus('<span class=\"err\">Hãy chọn tệp hoặc dán nội dung bài.<\/span>'); return; }\n    setStatus('Đang đọc tài liệu...');\n    try {\n      const src = await collectSource(sampleLimits);\n      o.text = src.text.trim(); images = src.images; o.images = images.length > 0;\n      if (src.skipped.length) toast('Bỏ qua ảnh: ' + src.skipped.join(', '));\n      if (!o.text && !images.length) { setStatus('<span class=\"err\">Không đọc được chữ trong tài liệu. Hãy thử ảnh chụp rõ hơn hoặc dán nội dung.<\/span>'); return; }\n    } catch (e) { setStatus('<span class=\"err\">Không mở được tệp. Hãy thử tệp PDF/Word khác hoặc dán nội dung.<\/span>'); return; }\n  }\n  const data = await runSample(buildPrompt(o), o, images, status);\n  if (!data) return;\n  data.subject ||= o.subject; data.grade ||= o.grade; data.book = o.book; data.title ||= o.lesson;\n  showNew(data, { grade: o.grade, subject: o.subject, book: o.book, lesson: o.lesson || data.title, level: o.level, text: (o.text || '').slice(0, 30000) });\n};\nlet autoT = null;\nfunction maybeAutoGenerate() {\n  if (!$('#autoGen').checked || !sample || busy || mode !== 'file' || !files.length) return;\n  clearTimeout(autoT); autoT = setTimeout(() => $('#goBtn').click(), 500);\n}\n\n/* ---------- improve one part ---------- */\nfunction ctxOf(d) { return d._ctx || { grade: d.grade, subject: d.subject, book: d.book, lesson: d.title, level: 'auto', text: '' }; }\nfunction renderParts(wrongs) {\n  const box = $('#parts'); if (!current) return;\n  const prev = new Set([...box.querySelectorAll('input:checked')].map(i => +i.value));\n  box.innerHTML = (current.sections || []).map((s, i) => {\n    const w = wrongs ? wrongs[i] : null;\n    const checked = wrongs ? w > 0 : prev.has(i);\n    const badge = w == null ? '' : w > 0 ? `<span class=\"badge bad\">chưa đúng ${w}<\/span>` : '<span class=\"badge ok\">đúng hết<\/span>';\n    return `<label class=\"part\"><input type=\"checkbox\" value=\"${i}\"${checked ? ' checked' : ''}><span>${esc(s.heading)}<\/span>${badge}<\/label>`;\n  }).join('');\n}\nconst GOALS = {\n  theory: 'Mục tiêu: NẮM CHẮC LÝ THUYẾT. Giải thích kỹ từng ý bằng lời dễ hiểu, thêm ví dụ minh hoạ gần gũi, chỉ ra chỗ học sinh hay nhầm. Phần lý thuyết dài hơn (5–8 ý mỗi mục) với nhiều chỗ trống; câu hỏi chủ yếu nhận biết – thông hiểu.',\n  practice: 'Mục tiêu: LUYỆN BÀI TẬP. Lý thuyết ngắn gọn (3–5 ý mỗi mục, có chỗ trống), nhiều câu hỏi và bài tập xếp từ dễ đến khó (nhận biết → thông hiểu → vận dụng); nếu môn học có bài toán/tính toán thì có bài tập tính toán.',\n  advanced: 'Mục tiêu: NÂNG CAO. Lý thuyết mở rộng ngắn gọn, câu hỏi mức vận dụng và vận dụng cao: tình huống thực tế, so sánh, phân tích, giải thích hiện tượng, bài tập khó nhiều bước.'\n};\nfunction plain(t) { return String(t).replace(/\\{\\{([^}]*)\\}\\}/g, (m, a) => a.split('|')[0]); }\n$('#improveBtn').onclick = async () => {\n  if (busy || !current) return;\n  const st2 = $('#status2');\n  if (!sample) { st2.innerHTML = '<span class=\"err\">Cần mở trang trong Claude (đã đăng nhập) để tạo phiếu ôn.<\/span>'; return; }\n  const idxs = [...$('#parts').querySelectorAll('input:checked')].map(i => +i.value);\n  if (!idxs.length) { st2.innerHTML = '<span class=\"err\">Hãy chọn ít nhất một phần.<\/span>'; return; }\n  const c = ctxOf(current), goal = document.querySelector('input[name=\"goal\"]:checked').value, note = $('#focusNote').value.trim();\n  const parts = idxs.map(i => current.sections[i]).filter(Boolean);\n  const partText = parts.map(s => `${s.heading}\\n${(s.theory || []).map(t => '- ' + plain(t)).join('\\n')}`).join('\\n\\n');\n  const wrongList = [];\n  idxs.forEach(i => { const [a, b] = secRanges[i] || [0, 0]; items.slice(a, b).forEach(it => { if (itemGood[it.id] === false && it.label) wrongList.push(plain(it.label)); }); });\n  const o = { grade: +c.grade || 6, subject: c.subject, book: c.book, level: c.level || 'auto', goal, len: 'medium' };\n  const Q3 = '\"\"\"';\n  const prompt = `Bạn là giáo viên Việt Nam giỏi. Học sinh lớp ${o.grade}, môn ${o.subject}${o.book ? ', bộ sách ' + o.book : ''}, bài \"${c.lesson || current.title}\" muốn CẢI THIỆN các phần sau:\n${Q3}\n${partText}\n${Q3}\n${wrongList.length ? 'Các ý học sinh vừa làm SAI (tập trung củng cố):\\n- ' + wrongList.slice(0, 20).join('\\n- ') + '\\n' : ''}${note ? 'Học sinh tự nhận xét chỗ chưa hiểu: \"' + note.slice(0, 500) + '\"\\n' : ''}${c.text ? 'TÀI LIỆU GỐC của bài (chỉ dùng kiến thức trong tài liệu này):\\n' + Q3 + '\\n' + c.text.slice(0, 30000) + '\\n' + Q3 + '\\n' : 'Chỉ dùng kiến thức chắc chắn đúng theo chương trình GDPT 2018.\\n'}\nHãy soạn một PHIẾU ÔN TRỌNG TÂM chỉ cho các phần trên (không lan sang phần khác của bài).\n${GOALS[goal]}\nMức độ phù hợp lớp: ${levelGuide(o.grade, o.level)}\nChia thành 2–4 mục nhỏ (I., II., ...). Trong \"theory\", đục lỗ từ khóa bằng {{đáp án}} (nhiều đáp án: {{a|b}}). Mỗi mục 4–6 câu hỏi thuộc ít nhất 3 loại khác nhau, xếp từ dễ đến khó, có câu hỏi đánh trúng các ý học sinh làm sai. \"practice\": 4–6 câu tổng hợp. Câu mới, không chép lại y nguyên câu cũ. Toàn bộ bằng tiếng Việt có dấu.\n\nCÁC LOẠI CÂU HỎI (đúng định dạng JSON):\n- {\"type\":\"fill\",\"q\":\"Câu có {{chỗ trống}} cần điền.\"}\n- {\"type\":\"mcq\",\"q\":\"Câu hỏi?\",\"options\":[\"...\",\"...\",\"...\",\"...\"],\"answer\":0,\"explain\":\"giải thích ngắn\"}   (answer = chỉ số phương án đúng, bắt đầu từ 0)\n- {\"type\":\"tf\",\"q\":\"Dẫn đề\",\"items\":[{\"s\":\"Nhận định\",\"answer\":true}]}\n- {\"type\":\"match\",\"q\":\"Nối mỗi ý ở cột A với một ý phù hợp ở cột B.\",\"pairs\":[{\"a\":\"...\",\"b\":\"...\"}]}\n- {\"type\":\"order\",\"q\":\"Sắp xếp ... theo đúng thứ tự.\",\"items\":[\"bước 1\",\"bước 2\",\"bước 3\"]}   (liệt kê theo thứ tự ĐÚNG)\n- {\"type\":\"short\",\"q\":\"Câu hỏi\",\"answer\":\"đáp án hoặc đáp án mẫu\"}\n\nTRẢ VỀ DUY NHẤT một JSON:\n{\"title\":\"Ôn tập trọng tâm: ...\",\"objectives\":[\"...\"],\"sections\":[{\"heading\":\"I. ...\",\"theory\":[\"...\"],\"questions\":[...]}],\"practice\":[...]}`;\n  const data = await runSample(prompt, o, null, st2);\n  if (!data) return;\n  data.subject = c.subject; data.grade = o.grade; data.book = c.book; data.focus = true; data.title ||= 'Ôn tập trọng tâm';\n  showNew(data, c);\n};\n\n/* ---------- lesson list (table of contents) ---------- */\nconst lessonInput = $('#lesson'), lessonList = $('#lessonList');\nconst tocMem = {}; let tocCtl = null, tocShown = [], tocActive = -1;\nconst fold = s => String(s).normalize('NFD').replace(/[\\u0300-\\u036f]/g, '').replace(/đ/g, 'd').replace(/Đ/g, 'D').toLowerCase();\nconst tocKey = () => ['toc', $('#book').value, gradeSel.value, subjSel.value].join('|');\nconst tocLabel = () => `${subjSel.value} ${gradeSel.value} · ${$('#book').value}`;\nfunction openList() { lessonList.hidden = false; lessonInput.setAttribute('aria-expanded', 'true'); }\nfunction closeList() { lessonList.hidden = true; lessonInput.setAttribute('aria-expanded', 'false'); tocActive = -1; }\nfunction listMsg(html) { lessonList.innerHTML = html; openList(); }\nfunction renderToc(toc, loading) {\n  const q = fold(lessonInput.value.trim());\n  tocShown = []; let html = '';\n  for (const ch of toc.chapters || []) {\n    const ls = (ch.lessons || []).fil \n    const id = items.length; items.push({ kind: 'order', id, answer: correct, label: q.q });\n    const lis = mixed.map((s, i) => `<li><span class=\"n\">${i + 1}.<\/span><span>${esc(s)}<\/span><button type=\"button\" data-mv=\"-1\" aria-label=\"Lên\">↑<\/button><button type=\"button\" data-mv=\"1\" aria-label=\"Xuống\">↓<\/button><\/li>`).join('');\n    return `<div class=\"q\">${head}<ol class=\"order\" data-item=\"${id}\">${lis}<\/ol><p class=\"explain\" data-fix=\"${id}\" hidden>Thứ tự đúng: ${correct.map(esc).join(' → ')}<\/p><\/div>`;\n  }\n  // short\n  const id = items.length;\n  if (isAutoShort(q)) {\n    items.push({ kind: 'blank', id, alts: String(q.answer).split('|').map(s => s.trim()), label: q.q });\n    const w = Math.max(8, Math.min(26, String(q.answer).length + 4));\n    return `<div class=\"q\">${head}<p>Trả lời: <input class=\"blank\" data-item=\"${id}\" style=\"width:${w}ch\" aria-label=\"Câu trả lời\" autocomplete=\"off\"><span class=\"fix\" data-fix=\"${id}\" hidden>${esc(String(q.answer).split('|')[0])}<\/span><\/p><\/div>`;\n  }\n  hasLongShort = true;\n  items.push({ kind: 'long', id, q: q.q, answer: q.answer });\n  return `<div class=\"q\">${head}<textarea class=\"long\" data-item=\"${id}\" aria-label=\"Bài làm\"><\/textarea><p class=\"aifeedback\" data-ai=\"${id}\" hidden><\/p><button type=\"button\" class=\"reveal\" data-reveal=\"${id}\">Xem đáp án gợi ý<\/button><p class=\"model\" data-fix=\"${id}\" hidden>${esc(q.answer)}<\/p><\/div>`;\n}\nfunction isAutoShort(q) { const a = String(q.answer ?? ''); return a.length > 0 && a.length <= 24 && a.split(/\\s+/).length <= 4; }\n\nfunction renderSheet(d, isExample) {\n  current = d; items = []; qNo = 0; hasLongShort = false;\n  const sheet = $('#sheet'); sheet.classList.remove('show-ans');\n  secRanges = []; itemGood = {};\n  const secs = (d.sections || []).map(s => { const start = items.length; const h = `<section class=\"sec\"><h3>${esc(s.heading)}<\/h3>\n      <ul class=\"theory\">${(s.theory || []).map(t => `<li>${blanksHTML(t)}<\/li>`).join('')}<\/ul>\n      ${(s.questions || []).length ? `<div class=\"qbox\"><span class=\"qhead\">Câu hỏi<\/span>${s.questions.map(questionHTML).join('')}<\/div>` : ''}<\/section>`; secRanges.push([start, items.length]); return h; }).join('');\n  const prac = (d.practice || []).length ? `<section class=\"sec\"><h3>Luyện tập tổng hợp<\/h3><div class=\"qbox\"><span class=\"qhead\">Câu hỏi<\/span>${d.practice.map(questionHTML).join('')}<\/div><\/section>` : '';\n  sheet.innerHTML = `<header class=\"sh-head\">${d.focus ? '<span class=\"focus-flag\">Phiếu ôn trọng tâm<\/span>' : ''}<span class=\"sh-kicker\">Tài liệu rời · ${esc(d.subject)} ${esc(d.grade)}${d.book ? ' · ' + esc(d.book) : ''}<\/span>\n      <h2 class=\"sh-title\">${esc(d.title)}<\/h2>\n      <div class=\"sh-name\"><span>Họ và tên: <input id=\"stName\" aria-label=\"Họ và tên\"><\/span><span>Lớp: <input id=\"stClass\" class=\"short\" aria-label=\"Lớp\"><\/span><\/div><\/header>\n    ${(d.objectives || []).length ? `<div class=\"objectives\"><b>Sau bài học, em có thể<\/b><ul>${d.objectives.map(o => `<li>${esc(o)}<\/li>`).join('')}<\/ul><\/div>` : ''}\n    ${secs}${prac}<p class=\"sheet-foot\">Điền vào chỗ trống, làm các câu hỏi, rồi bấm “Kiểm tra bài”.<\/p>`;\n  $('#exFlag').hidden = !isExample;\n  $('#score').textContent = 'Chưa chấm'; $('#score').classList.remove('has');\n  $('#aiGradeBtn').hidden = !sample || !hasLongShort;\n  ansShown = false; $('#ansBtn').textContent = 'Hiện đáp án';\n  renderParts(null);\n}\n\n/* ---------- interactions ---------- */\nconst sheet = $('#sheet');\nsheet.addEventListener('click', e => {\n  const mv = e.target.closest('button[data-mv]');\n  if (mv) { const li = mv.closest('li'), ol = li.parentElement; const d = +mv.dataset.mv;\n    if (d < 0 && li.previousElementSibling) ol.insertBefore(li, li.previousElementSibling);\n    if (d > 0 && li.nextElementSibling) ol.insertBefore(li.nextElementSibling, li);\n    [...ol.children].forEach((x, i) => x.querySelector('.n').textContent = (i + 1) + '.'); ol.classList.remove('ok', 'bad'); mv.focus(); return; }\n  const rv = e.target.closest('button[data-reveal]');\n  if (rv) { const m = sheet.querySelector(`[data-fix=\"${rv.dataset.reveal}\"]`); m.hidden = !m.hidden; rv.textContent = m.hidden ? 'Xem đáp án gợi ý' : 'Ẩn đáp án gợi ý'; }\n});\nsheet.addEventListener('input', e => { const el = e.target; el.classList?.remove('ok', 'bad'); el.closest('.mrow')?.classList.remove('ok', 'bad'); });\nfunction valueOf(it) {\n  if (it.kind === 'blank') return sheet.querySelector(`[data-item=\"${it.id}\"]`).value;\n  if (it.kind === 'mcq') { const r = sheet.querySelector(`input[name=\"mcq${it.id}\"]:checked`); return r ? +r.value : null; }\n  if (it.kind === 'tf') { const r = sheet.querySelector(`input[name=\"tf${it.id}\"]:checked`); return r ? r.value === '1' : null; }\n  if (it.kind === 'match') return sheet.querySelector(`[data-item=\"${it.id}\"]`).value;\n  if (it.kind === 'order') return [...sheet.querySelector(`[data-item=\"${it.id}\"]`).children].map(li => li.children[1].textContent);\n  return sheet.querySelector(`[data-item=\"${it.id}\"]`).value;\n}\nfunction check() {\n  let ok = 0, total = 0;\n  for (const it of items) {\n    if (it.kind === 'long') continue;\n    total++; const v = valueOf(it); let good = false;\n    if (it.kind === 'blank') { good = it.alts.some(a => norm(a) === norm(v)); const el = sheet.querySelector(`[data-item=\"${it.id}\"]`); el.classList.toggle('ok', good); el.classList.toggle('bad', !good); sheet.querySelector(`[data-fix=\"${it.id}\"]`).hidden = good; }\n    if (it.kind === 'mcq') { good = v === it.answer; sheet.querySelectorAll(`[data-opt^=\"${it.id}-\"]`).forEach((o, i) => { o.classList.toggle('ok', i === it.answer); o.classList.toggle('bad', i === v && !good); }); const ex = sheet.querySelector(`[data-fix=\"${it.id}\"]`); if (ex) ex.hidden = false; }\n    if (it.kind === 'tf') { good = v === it.answer; const tr = sheet.querySelector(`[data-row=\"${it.id}\"]`); tr.classList.toggle('ok', good); tr.classList.toggle('bad', !good); }\n    if (it.kind === 'match') { good = v === it.answer; const r = sheet.querySelector(`[data-row=\"${it.id}\"]`); r.classList.toggle('ok', good); r.classList.toggle('bad', !good); }\n    if (it.kind === 'order') { good = v.join('\\u0001') === it.answer.join('\\u0001'); const ol = sheet.querySelector(`[data-item=\"${it.id}\"]`); ol.classList.toggle('ok', good); ol.classList.toggle('bad', !good); sheet.querySelector(`[data-fix=\"${it.id}\"]`).hidden = good; }\n    itemGood[it.id] = good;\n    if (good) ok++;\n  }\n  sheet.querySelectorAll('.match').forEach(m => { const q = m.closest('.q'); const ex = q.querySelector('.explain'); if (ex) ex.hidden = !q.querySelector('.mrow.bad'); });\n  renderParts(secRanges.map(([a, b]) => items.slice(a, b).filter(it => it.kind !== 'long' && itemGood[it.id] === false).length));\n  const sc = $('#score'); sc.textContent = `Đúng ${ok}/${total}` + (total ? ` · ${String(Math.round(ok / total * 100) / 10).replace('.', ',')} điểm` : ''); sc.classList.add('has');\n}\nlet ansShown = false;\nfunction showAnswers() {\n  ansShown = !ansShown;\n  sheet.querySelectorAll('[data-fix]').forEach(el => el.hidden = !ansShown);\n  sheet.querySelectorAll('button[data-reveal]').forEach(b => b.textContent = ansShown ? 'Ẩn đáp án gợi ý' : 'Xem đáp án gợi ý');\n  $('#ansBtn').textContent = ansShown ? 'Ẩn đáp án' : 'Hiện đáp án';\n}\n$('#checkBtn').onclick = check;\n$('#ansBtn').onclick = showAnswers;\n$('#resetBtn').onclick = () => { if (current) renderSheet(current, !$('#exFlag').hidden); window.scrollTo({ top: 0, behavior: 'smooth' }); };\n\n/* ---------- AI grading of open answers ---------- */\n$('#aiGradeBtn').onclick = async () => {\n  if (!sample) return;\n  const longs = items.filter(it => it.kind === 'long').map(it => ({ it, student: valueOf(it).trim() })).filter(x => x.student);\n  if (!longs.length) { toast('Hãy viết bài làm ở các câu tự luận trước.'); return; }\n  const btn = $('#aiGradeBtn'); btn.disabled = true; btn.textContent = 'Đang chấm...';\n  try {\n    const list = longs.map((x, i) => `#${i}\\nCâu hỏi: ${x.it.q}\\nĐáp án mẫu: ${x.it.answer}\\nBài làm của học sinh: ${x.student}`).join('\\n\\n');\n    const res = await sample.json(`Bạn là giáo viên lớp ${current.grade} môn ${current.subject}. Chấm các câu tự luận sau so với đáp án mẫu, chấp nhận cách diễn đạt khác nếu đúng ý. Nhận xét 1 câu ngắn, thân thiện, chỉ ra ý còn thiếu.\\n\\n${list}\\n\\nTrả về DUY NHẤT JSON mảng: [{\"i\":0,\"score\":0.5,\"comment\":\"...\"}] với score từ 0 đến 1.`, { modelTier: 'quick', cache: false });\n    for (const r of Array.isArray(res) ? res : []) { const x = longs[+r.i]; if (!x) continue; const p = sheet.querySelector(`[data-ai=\"${x.it.id}\"]`); p.hidden = false; p.textContent = `${Math.round((+r.score || 0) * 100)}% · ${r.comment || ''}`; }\n  } catch (e) { if (e?.code !== 'cancelled') toast(ERR[e?.code] || 'Chưa chấm được. Thử lại sau.'); }\n  finally { btn.disabled = false; btn.textContent = 'Nhờ AI chấm tự luận'; }\n};\n\n/* ---------- Word export ---------- */\n$('#dlBtn').onclick = async () => {\n  if (!downloads || !current) return;\n  const btn = $('#dlBtn'); btn.disabled = true; btn.textContent = 'Đang tạo file...';\n  try {\n    await loadScript(LIB.docx);\n    const blob = await window.docx.Packer.toBlob(buildDocx(current));\n    const fname = 'Tai_lieu_roi_' + String(current.title || 'bai_hoc').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/g, 'd').replace(/Đ/g, 'D').replace(/[^A-Za-z0-9]+/g, '_').replace(/^_|_$/g, '').slice(0, 60) + '.docx';\n    await downloads.save({ filename: fname, data: blob });\n    toast('Đã lưu ' + fname);\n  } catch (e) { if (e?.code !== 'declined') toast('Chưa tạo được file Word. Thử lại sau.'); }\n  finally { btn.disabled = false; btn.textContent = 'Tải file Word'; }\n};\nfunction buildDocx(d) {\n  const { Document, Paragraph, TextRun, Table, TableRow, TableCell, WidthType, AlignmentType, PageBreak } = window.docx;\n  const FONT = 'Times New Roman', SZ = 26;\n  const run = (text, o = {}) => new TextRun({ text, font: FONT, size: SZ, ...o });\n  const para = (runs, o = {}) => new Paragraph({ children: Array.isArray(runs) ? runs : [runs], spacing: { after: 100, line: 320 }, ...o });\n  const dots = n => '.'.repeat(Math.max(10, Math.min(40, n * 2 + 6)));\n  const blankRuns = text => String(text).split(/(\\{\\{[^}]*\\}\\})/g).filter(Boolean).map(p => { const m = p.match(/^\\{\\{([^}]*)\\}\\}$/); return m ? run(dots(m[1].split('|')[0].length)) : run(p); });\n  const blankAns = text => [...String(text).matchAll(/\\{\\{([^}]*)\\}\\}/g)].map(m => m[1].split('|')[0].trim());\n  const cell = (text, o = {}) => new TableCell({ children: [para(run(text, o.bold ? { bold: true } : {}))], width: o.w ? { size: o.w, type: WidthType.PERCENTAGE } : undefined });\n  const out = [], key = []; let n = 0;\n  out.push(para(run(`TÀI LIỆU RỜI · ${d.subject} ${d.grade}${d.book ? ' · ' + d.book : ''}`, { size: 22, bold: true }), { alignment: AlignmentType.CENTER }));\n  out.push(para(run(String(d.title || '').toUpperCase(), { size: 32, bold: true }), { alignment: AlignmentType.CENTER }));\n  out.push(para(run('Họ và tên: ................................................   Lớp: ............'), { alignment: AlignmentType.CENTER, spacing: { after: 240 } }));\n  if ((d.objectives || []).length) { out.push(para(run('Mục tiêu: ', { bold: true }))); d.objectives.forEach(o => out.push(para(run('– ' + o)))); }\n  const addQ = q => {\n    n++; const t = q.type; const label = run(`Câu ${n}. `, { bold: true });\n    if (t === 'fill') { out.push(para([label, ...blankRuns(q.q)])); key.push(`Câu ${n}: ${blankAns(q.q).join('; ')}`); return; }\n    out.push(para([label, run(q.q)]));\n    if (t === 'mcq') { (q.options || []).forEach((o, i) => out.push(para(run(`     ${LETTERS[i]}. ${String(o).replace(/^[A-D][.)]\\s*/, '')}`)))); key.push(`Câu ${n}: ${LETTERS[+q.answer || 0]}${q.explain ? ' – ' + q.explain : ''}`); }\n    else if (t === 'tf') { out.push(new Table({ width: { size: 100, type: WidthType.PERCENTAGE }, rows: [new TableRow({ children: [cell('Nhận định', { bold: true, w: 80 }), cell('Đúng', { bold: true, w: 10 }), cell('Sai', { bold: true, w: 10 })] }), ...(q.items || []).map((it, i) => new TableRow({ children: [cell(`${'abcdefgh'[i]}) ${it.s}`), cell(''), cell('')] }))] })); key.push(`Câu ${n}: ${(q.items || []).map((it, i) => 'abcdefgh'[i] + ') ' + (it.answer === true || it.answer === 'true' ? 'Đ' : 'S')).join(', ')}`); }\n    else if (t === 'match') { const pairs = q.pairs || []; const right = shuffle(pairs.map((p, i) => ({ b: p.b, i }))); const L = {}; right.forEach((r, k) => L[r.i] = LETTERS[k]);\n      out.push(new Table({ width: { size: 100, type: WidthType.PERCENTAGE }, rows: [new TableRow({ children: [cell('Cột A', { bold: true, w: 50 }), cell('Cột B', { bold: true, w: 50 })] }), ...pairs.map((p, i) => new TableRow({ children: [cell(`${i + 1}. ${p.a}`), cell(`${LETTERS[i]}. ${right[i]?.b ?? ''}`)] }))] }));\n      out.push(para(run('Trả lời: ' + pairs.map((p, i) => `${i + 1} – .....`).join(';   '))));\n      key.push(`Câu ${n}: ${pairs.map((p, i) => (i + 1) + '–' + L[i]).join(', ')}`); }\n    else if (t === 'order') { shuffle(q.items || []).forEach(s => out.push(para(run(`     (   ) ${s}`)))); key.push(`Câu ${n}: ${(q.items || []).join(' → ')}`); }\n    else { const lines = isAutoShort(q) ? 1 : 4; for (let i = 0; i < lines; i++) out.push(para(run('.'.repeat(120), { size: 20 }))); key.push(`Câu ${n}: ${String(q.answer).split('|')[0]}`); }\n  };\n  (d.sections || []).forEach(s => {\n    out.push(para(run(s.heading, { bold: true, size: 28 }), { spacing: { before: 240, after: 120 } }));\n    const th = []; (s.theory || []).forEach(t => { out.push(para([run('• '), ...blankRuns(t)])); th.push(...blankAns(t)); });\n    if (th.length) key.push(`${s.heading} – lý thuyết: ${th.join('; ')}`);\n    if ((s.questions || []).length) { out.push(para(run('Câu hỏi', { bold: true, italics: true }))); s.questions.forEach(addQ); }\n  });\n  if ((d.practice || []).length) { out.push(para(run('LUYỆN TẬP TỔNG HỢP', { bold: true, size: 28 }), { spacing: { before: 240, after: 120 } })); d.practice.forEach(addQ); }\n  out.push(new Paragraph({ children: [new PageBreak()] }));\n  out.push(para(run('ĐÁP ÁN', { bold: true, size: 30 }), { alignment: AlignmentType.CENTER }));\n  key.forEach(k => out.push(para(run(k))));\n  return new Document({ creator: 'Bảng Đen Số', title: d.title, sections: [{ properties: { page: { margin: { top: 1134, bottom: 1134, left: 1418, right: 1134 } } }, children: out }] });\n}\n\n/* ---------- example sheet ---------- */\nconst EXAMPLE = {\n  title: 'Tế bào – đơn vị cơ sở của sự sống', subject: 'Khoa học tự nhiên', grade: 6, book: 'Kết nối tri thức với cuộc sống',\n  objectives: ['Nêu được khái niệm tế bào và các thành phần chính của tế bào.', 'Phân biệt tế bào nhân sơ với nhân thực, tế bào động vật với thực vật.', 'Giải thích được ý nghĩa của sự lớn lên và sinh sản của tế bào.'],\n  sections: [\n    { heading: 'I. Khái niệm tế bào',\n      theory: ['Tế bào là đơn vị {{cấu trúc|cấu tạo}} và {{chức năng}} cơ bản của cơ thể sống.', 'Mọi cơ thể sống đều được cấu tạo từ {{tế bào}}.', 'Hầu hết tế bào có kích thước rất nhỏ, muốn quan sát phải dùng {{kính hiển vi}}.', 'Một số tế bào khá lớn, như tế bào trứng cá chép, có thể quan sát bằng {{mắt thường}}.'],\n      questions: [\n        { type: 'mcq', q: 'Đơn vị cấu trúc cơ bản của mọi cơ thể sống là gì?', options: ['Mô', 'Tế bào', 'Cơ quan', 'Hệ cơ quan'], answer: 1, explain: 'Mô, cơ quan, hệ cơ quan đều được tạo thành từ nhiều tế bào.' },\n        { type: 'tf', q: 'Chọn Đúng hoặc Sai cho mỗi nhận định.', items: [{ s: 'Mọi cơ thể sống đều được cấu tạo từ tế bào.', answer: true }, { s: 'Tất cả tế bào đều nhìn thấy được bằng mắt thường.', answer: false }] }\n      ] },\n    { heading: 'II. Cấu tạo tế bào',\n      theory: ['Tế bào có 3 thành phần chính: {{màng tế bào}}, {{chất tế bào}} và nhân (hoặc vùng nhân).', 'Màng tế bào bảo vệ và {{kiểm soát}} các chất đi vào, đi ra khỏi tế bào.', 'Nhân tế bào là trung tâm {{điều khiển}} mọi hoạt động sống của tế bào.', 'Tế bào {{nhân sơ}} chưa có màng nhân; tế bào {{nhân thực}} có nhân hoàn chỉnh với màng nhân.', 'Tế bào thực vật có {{thành tế bào}} và {{lục lạp}}, tế bào động vật không có.'],\n      questions: [\n        { type: 'match', q: 'Nối mỗi thành phần ở cột A với chức năng phù hợp ở cột B.', pairs: [{ a: 'Màng tế bào', b: 'Bảo vệ, kiểm soát chất đi vào và đi ra' }, { a: 'Chất tế bào', b: 'Nơi diễn ra hầu hết hoạt động sống' }, { a: 'Nhân tế bào', b: 'Điều khiển mọi hoạt động sống' }, { a: 'Lục lạp', b: 'Thực hiện quang hợp' }] },\n        { type: 'mcq', q: 'Tế bào nào sau đây là tế bào nhân sơ?', options: ['Tế bào vi khuẩn', 'Tế bào gan', 'Tế bào lá cây', 'Tế bào thần kinh'], answer: 0, explain: 'Vi khuẩn chưa có màng nhân, chất di truyền nằm ở vùng nhân.' },\n        { type: 'fill', q: 'Bào quan chỉ có ở tế bào thực vật, giúp cây quang hợp là {{lục lạp}}.' }\n      ] },\n    { heading: 'III. Sự lớn lên và sinh sản của tế bào',\n      theory: ['Tế bào lớn lên đến một kích thước nhất định thì {{phân chia}} để sinh sản.', 'Từ 1 tế bào mẹ, sau một lần phân chia tạo ra {{2|hai}} tế bào con.', 'Sự lớn lên và sinh sản của tế bào giúp cơ thể {{lớn lên|sinh trưởng}} và thay thế các tế bào già, bị tổn thương.'],\n      questions: [\n        { type: 'order', q: 'Sắp xếp các giai đoạn phân chia của tế bào theo đúng thứ tự.', items: ['Tế bào lớn lên đến kích thước nhất định', 'Nhân tế bào phân chia', 'Chất tế bào phân chia', 'Hình thành hai tế bào con'] },\n        { type: 'short', q: 'Một tế bào phân chia liên tiếp 3 lần. Hỏi tạo ra bao nhiêu tế bào con?', answer: '8|tám' }\n      ] }\n  ],\n  practice: [\n    { type: 'short', q: 'Vì sao khi bị đứt tay nhẹ, sau một thời gian vết thương tự lành?', answer: 'Vì các tế bào ở vùng da bị tổn thương lớn lên và phân chia, tạo ra các tế bào mới thay thế tế bào bị tổn thương.' },\n    { type: 'mcq', q: 'Thành phần nào có ở tế bào thực vật nhưng không có ở tế bào động vật?', options: ['Màng tế bào', 'Nhân', 'Thành tế bào', 'Chất tế bào'], answer: 2 }\n  ]\n};\nrenderSheet(EXAMPLE, true);\nrenderRecent();\n})();\n<\/script>\n<\/body><\/html>";

        const coverEls = {};
        let seed = 7;
        const rnd = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
        let delay = 0;

        function spine(shelfH, opt) {
            const el = document.createElement('div');
            el.className = 'spine' + (opt ? ' opt' : '');
            el.style.width = (20 + rnd() * 20) + 'px';
            el.style.height = (shelfH * (0.62 + rnd() * 0.33)) + 'px';
            el.style.setProperty('--c', SPINE_COLORS[Math.floor(rnd() * SPINE_COLORS.length)]);
            el.style.animationDelay = (delay += 0.02) + 's';
            // once it has slid in, freeze it so the wiggle can't replay the entrance
            el.addEventListener('animationend', e => {
                if (e.animationName === 'slideIn') { el.style.animation = 'none'; el.style.opacity = '1'; }
            });
            return el;
        }
        function gap(shelfH, wide, opt) {
            const el = document.createElement('div');
            el.className = 'gap' + (wide ? ' wide' : '') + (opt ? ' opt' : '');
            el.style.width = (wide ? 46 : 26 + rnd() * 10) + 'px';
            el.style.height = (shelfH * 0.8) + 'px';
            el.style.animationDelay = (rnd() * 2) + 's';
            el.innerHTML = wide ? '<span>THIẾU SÁCH</span>' : '<span>?</span>';
            return el;
        }
        function tvSet() {
            const el = document.createElement('button');
            el.className = 'tv';
            el.setAttribute('aria-label', 'Xem video hướng dẫn Bảng Đen Số');
            el.innerHTML = `<span class="tv-ant" aria-hidden="true"></span><span class="tv-body"><span class="tv-screen"><img alt="" src="data:image/jpeg;base64,${TV_THUMB}"><span class="tv-play">▶</span></span><span class="tv-side"><i></i><i></i><b></b></span></span><span class="tv-feet" aria-hidden="true"></span><span class="tv-cap">Hướng dẫn dùng web</span>`;
            el.addEventListener('click', openGuide);
            return el;
        }
        function cover(idx, featured) {
            const b = BOOKS[idx];
            const el = document.createElement('button');
            coverEls[idx] = el;
            el.className = 'cover' + (featured ? ' featured' : '');
            el.style.setProperty('--c', b.color);
            el.style.setProperty('--sd', (idx * 0.9) + 's');
            el.style.animationDelay = (delay += 0.08) + 's, ' + (idx * 0.6) + 's';
            el.innerHTML = `<span class="c-tag">${b.tag}</span><span class="c-title">${b.title}</span><span class="c-foot">${b.foot}</span>`;
            el.addEventListener('click', () => openBook(idx, el));
            return el;
        }
        // keep adding books (and the odd empty slot) until the shelf is full
        function packShelf(shelf, h) {
            const room = () => shelf.clientWidth - 36 - [...shelf.children].reduce((w, c) => {
                if (c.classList.contains('tag') || c.classList.contains('shelf-label')) return w;
                const cs = getComputedStyle(c);
                return w + c.offsetWidth + parseFloat(cs.marginLeft) + parseFloat(cs.marginRight) + 3;
            }, 0);
            let left = true, n = 0;
            while (room() > 46 && n < 80) {
                const el = (n % 7 === 5) ? gap(h) : spine(h);
                if (left) shelf.insertBefore(el, shelf.firstChild); else shelf.appendChild(el);
                left = !left; n++;
            }
        }
        function stack() {
            const el = document.createElement('div');
            el.className = 'stack';
            const k = 2 + Math.floor(rnd() * 3);
            for (let i = 0; i < k; i++) {
                const b = document.createElement('i');
                b.style.width = (80 + rnd() * 40) + 'px';
                b.style.setProperty('--c', SPINE_COLORS[Math.floor(rnd() * SPINE_COLORS.length)]);
                el.appendChild(b);
            }
            return el;
        }
        function fill(shelf, pattern, h) {
            pattern.split(' ').forEach(t => {
                if (t === 's') shelf.appendChild(spine(h));
                else if (t === 'S') shelf.appendChild(spine(h, true));          // hidden on small screens
                else if (t === 'L') { const e = spine(h); e.classList.add('lean'); shelf.appendChild(e); }
                else if (t === 'g') shelf.appendChild(gap(h));
                else if (t === 'G') shelf.appendChild(gap(h, false, true));
                else if (t === 'W') shelf.appendChild(gap(h, true));
                else if (t === 'H') shelf.appendChild(stack());
                else if (t === 'E') { const e = document.createElement('div'); e.className = 'bookend'; shelf.appendChild(e); }
                else if (t === 'T') shelf.appendChild(tvSet());
                else if (t.startsWith('c')) shelf.appendChild(cover(parseInt(t.slice(1), 10), t.endsWith('f')));
            });
        }
        // featured = "c0f". Different arrangement for phones vs. computers.
        const LAYOUTS = {
            wide: [
                ['s s g s s H s s W s c0f s s g s s H s s g s L', 300, ''],
                ['s g c1 s G c2 g c3 s g c4 s s', 220, ''],
                ['E s s g s H s c5 T s g s s W s g s s L s g E', 230, '', true]
            ],
            narrow: [
                ['s g c0f s', 270, ''],
                ['c1 g c2', 190, ''],
                ['c3 s c4', 190, ''],
                ['c5 T', 200, ''],
                ['s g s H W s g s L s', 130, '', true]
            ]
        };
        let currentLayout = null;
        function buildShelves() {
            const mode = window.innerWidth < 820 ? 'narrow' : 'wide';
            if (mode === currentLayout) return fitBookcase();
            currentLayout = mode;
            const bc = document.getElementById('bookcase');
            bc.innerHTML = '';
            seed = 7; delay = 0;
            const crown = document.createElement('div');
            crown.className = 'crown';
            crown.innerHTML = '<span class="plate">NGĂN SÁCH TRỐNG</span>';
            bc.appendChild(crown);
            const note = document.createElement('button');
            note.className = 'pin-note';
            note.setAttribute('aria-label', 'Xem infographic');
            note.innerHTML = `<div class="n-title">INFOGRAPHIC</div><div class="n-sub">Nhấn để xem</div>`;
            note.addEventListener('click', openIg);
            bc.appendChild(note);
            const pnote = document.createElement('button');
            pnote.className = 'pin-note poster-note';
            pnote.setAttribute('aria-label', 'Xem poster');
            pnote.innerHTML = `<div class="n-title">POSTER</div><div class="n-sub">Nhấn để xem</div>`;
            pnote.addEventListener('click', openPoster);
            bc.appendChild(pnote);
            const cnote = document.createElement('button');
            cnote.className = 'cass-note';
            cnote.setAttribute('aria-label', 'Xem video');
            cnote.innerHTML = cassetteHTML() + '<span class="cass-cap">Video giới thiệu</span>';
            cnote.addEventListener('click', openVideo);
            cnote.addEventListener('mouseenter', () => cnote.querySelector('.cs').classList.add('spin'));
            cnote.addEventListener('mouseleave', () => cnote.querySelector('.cs').classList.remove('spin'));
            bc.appendChild(cnote);
            LAYOUTS[mode].forEach(([pattern, h, label, withTag]) => {
                const shelf = document.createElement('div');
                shelf.className = 'shelf';
                fill(shelf, pattern, h);
                if (label) {
                    const l = document.createElement('span');
                    l.className = 'shelf-label';
                    l.textContent = label;
                    shelf.appendChild(l);
                }
                if (withTag) {
                    const tag = document.createElement('div');
                    tag.className = 'tag';
                    tag.innerHTML = '<div><b>3.916.370</b>bản SGK còn thiếu<br>trên cả nước (14/9/2026)</div>';
                    shelf.appendChild(tag);
                }
                bc.appendChild(shelf);
                packShelf(shelf, h);
            });
            fitBookcase();
        }
        // shrink the whole bookcase so it always fits the screen height
        // remove plain spines/gaps from the ends of a shelf until everything fits inside the bookcase
        function trimShelves() {
            document.querySelectorAll('#bookcase .shelf').forEach(shelf => {
                const kids = () => [...shelf.children].filter(c => !c.classList.contains('tag') && !c.classList.contains('shelf-label') && getComputedStyle(c).display !== 'none');
                const used = () => kids().reduce((w, c) => { const cs = getComputedStyle(c); return w + c.offsetWidth + parseFloat(cs.marginLeft) + parseFloat(cs.marginRight) + 3 + (c.classList.contains('lean') ? c.offsetHeight * 0.1 : 0); }, 0);
                const cs = getComputedStyle(shelf);
                const avail = () => shelf.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight) - 8;
                let fromEnd = true, guard = 0;
                while (used() > avail() && guard++ < 60) {
                    const list = kids().filter(c => !c.classList.contains('cover') && !c.classList.contains('cass-note') && !c.classList.contains('tv'));
                    if (!list.length) break;
                    (fromEnd ? list[list.length - 1] : list[0]).remove();
                    fromEnd = !fromEnd;
                }
            });
        }
        function fitBookcase() {
            trimShelves();
            const bc = document.getElementById('bookcase');
            bc.style.zoom = 1;
            if (currentLayout === 'narrow') return;
            const room = window.innerHeight - 110;
            const z = Math.min(1, room / bc.offsetHeight);
            bc.style.zoom = z.toFixed(3);
        }
        buildShelves();
        let rt;
        window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(buildShelves, 120); });


        // ---------- Library wall: rows of full bookcases behind (drawn once) ----------
        function drawLibraryWall() {
            const cv = document.getElementById('libraryWall');
            const dpr = document.documentElement.classList.contains('lite') ? 1 : Math.min(window.devicePixelRatio || 1, 2);
            const w = window.innerWidth, h = window.innerHeight;
            cv.width = w * dpr; cv.height = h * dpr;
            const ctx = cv.getContext('2d');

b>tối đa 10%<\/b> số trang; photo nguyên cuốn có thể bị phạt <b>5–50 triệu đồng<\/b>.<\/p><\/div>\n    <\/section>\n\n    <section class=\"col\">\n      <div class=\"head\"><div class=\"num\" style=\"--c:#3f7d3a\">4<\/div><h2>Đang được xử lý thế nào?<\/h2><\/div>\n      <div class=\"stage\" style=\"--c:#8a5a33\"><div class=\"dot\">1<\/div><div class=\"card\"><div class=\"when\">Trước khai giảng<\/div><p>Bộ GD-ĐT yêu cầu Sở GD-ĐT và NXB bảo đảm cung ứng SGK (CV 5655, 21/8).<\/p><\/div><\/div>\n      <div class=\"stage\" style=\"--c:#2563eb\"><div class=\"dot\">2<\/div><div class=\"card\"><div class=\"when\">8/9 – 15/9<\/div><p><b>Điều chuyển sách<\/b> từ nơi thừa sang nơi thiếu, in tiếp, <b>SGK điện tử miễn phí<\/b>, đường dây nóng 24/7, ưu tiên vùng khó khăn.<\/p><\/div><\/div>\n      <div class=\"stage\" style=\"--c:#b3312b\"><div class=\"dot\">3<\/div><div class=\"card\"><div class=\"when\">20/9 – 30/9<\/div><p>Thủ tướng yêu cầu <b>giải quyết dứt điểm trước 25/9<\/b>; NXB in thêm ≈2,99 triệu cuốn dự phòng.<\/p><\/div><\/div>\n      <div class=\"stage\" style=\"--c:#16a34a\"><div class=\"dot\">4<\/div><div class=\"card\"><div class=\"when\">Dài hạn<\/div><p>Dữ liệu cung – cầu thống nhất, dự trữ sách cấp tỉnh, ổn định một bộ SGK, <b>miễn phí SGK vào 2030<\/b>.<\/p><\/div><\/div>\n    <\/section>\n  <\/main>\n\n  <section class=\"chalk\">\n    <div><span class=\"badge\">ĐỀ XUẤT CÁ NHÂN<\/span><h2>Bảng Đen Số<\/h2><\/div>\n    <p>Trong lúc chờ sách, việc học không nên phải chờ. <b>Bảng Đen Số<\/b> dùng AI biến bài học thành <b>tài liệu rời có chỗ trống để điền và câu hỏi theo từng lớp<\/b>. Cả lớp dùng chung một tài liệu, làm trên web hoặc in ra với chi phí thấp.<\/p>\n    <div class=\"steps\"><span>① Đưa bài học vào<\/span><span>② AI soạn phiếu<\/span><span>③ Cả lớp cùng học<\/span><\/div>\n  <\/section>\n\n  <footer class=\"foot\"><b>NGUỒN<\/b> Bộ GD-ĐT · NXB Giáo dục Việt Nam · Đại biểu Nhân dân · Báo Lào Cai · Giáo dục Việt Nam · Thanh tra · VietnamPlus · VnExpress · Việt Báo · Báo Pháp luật · Tiền Phong · Cổng TTĐT Hà Tĩnh — Số liệu đến cuối tháng 9/2026<\/footer>\n<\/body><\/html>\n";
        const igOverlay = document.getElementById('igOverlay');
        const igFrame = document.getElementById('igFrame');
        const igWrap = document.getElementById('igWrap');
        function fitIg() {
            let s = Math.min((window.innerWidth - 40) / 1920, (window.innerHeight - 90) / 1080);
            const small = s < 0.42;
            if (small) s = Math.min(0.62, (window.innerHeight - 130) / 1080);
            igOverlay.classList.toggle('scroll', small);
            igFrame.style.transform = `scale(${s})`;
            igWrap.style.width = 1920 * s + 'px';
            igWrap.style.height = 1080 * s + 'px';
        }
        function openIg() {
            SFX.init(); SFX.rustle();
            if (!igFrame.srcdoc) igFrame.srcdoc = IG_HTML;
            fitIg();
            igOverlay.classList.add('open');
        }
        const closeIg = () => igOverlay.classList.remove('open');
        document.getElementById('igClose').addEventListener('click', closeIg);
        igOverlay.addEventListener('click', e => { if (e.target === igOverlay) closeIg(); });
        document.addEventListener('keydown', e => { if (e.key === 'Escape' && igOverlay.classList.contains('open')) closeIg(); });
        window.addEventListener('resize', () => { if (igOverlay.classList.contains('open')) fitIg(); });

        // ---------- Previous / next book ----------
        const prevBtn = document.getElementById('prevBook');
        const nextBtn = document.getElementById('nextBook');
        const LAST = 5;
        function updateArrows() {
            const i = currentDetailIdx;
            [[prevBtn, i - 1, 'Cuốn trước'], [nextBtn, i + 1, 'Cuốn tiếp theo']].forEach(([btn, j, word]) => {
                if (j < 0 || j > LAST) { btn.hidden = true; return; }
                btn.hidden = false;
                btn.style.setProperty('--nc', BOOKS[j].color);
                btn.querySelector('.label').textContent = (window.innerWidth < 700 && BOOKS[j].short) ? BOOKS[j].short : BOOKS[j].title;
                btn.title = word + ': ' + BOOKS[j].title;
            });
        }
        // put the open "flying book" into its fully-open pose (used after switching books)
        function setOpenPose(f) {
            const W = parseFloat(f.style.width);
            f.querySelector('.fb-book').style.transform = `translateX(${W / 2}px)`;
            f.querySelector('.fb-cover').style.transform = 'rotateY(-178deg)';
            f.querySelector('.s1').style.transform = 'rotateY(-176deg)';
            f.querySelector('.s2').style.transform = 'rotateY(-174deg)';
            f.style.display = 'none';
        }
        function switchBook(dir) {
            if (!detailOpen || animating) return;
            const j = currentDetailIdx + dir;
            if (j < 0 || j > LAST) return;
            closeBook(() => setTimeout(() => openBook(j, coverEls[j]), 120));
        }
        prevBtn.addEventListener('click', () => switchBook(-1));
        nextBtn.addEventListener('click', () => switchBook(1));
        document.addEventListener('keydown', e => {
            if (!detailOpen || modal.classList.contains('open')) return;
            if (e.key === 'ArrowRight') switchBook(1);
            if (e.key === 'ArrowLeft') switchBook(-1);
        });

        document.getElementById('backBtn').addEventListener('click', () => closeBook());
        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') { if (modal.classList.contains('open')) closeMore(); else closeBook(); }
            if (e.key === 'Enter' && e.target.matches && e.target.matches('[data-more]')) e.target.click();
        });
    </script>
